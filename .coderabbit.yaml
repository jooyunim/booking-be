language: 'ko-KR'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  sequence_diagrams: false
  collapse_walkthrough: false

  path_instructions:
    # ─── 공통 TypeScript ───────────────────────────────────
    - path: '**/*.{ts,js}'
      instructions: |
        모든 리뷰 코멘트는 반드시 한국어로 작성해주세요.

        [리뷰 방식]
        - 불필요한 주석이나 dead code가 없는지 확인해주세요.
        - 네이밍 컨벤션을 따르는지 검토해주세요:
            - 변수/함수: camelCase
            - 일반 모듈 파일: camelCase (예: auth.service.ts)
            - 폴더: kebab-case
        - ESLint/Prettier 규칙 위반 중 실제 오류나 유지보수에 영향을 주는 경우만 리뷰해주세요.
        - 리뷰는 실제 버그, 보안, 성능, 데이터 무결성, 유지보수성 문제가 있는 경우에만 남겨주세요.
        - 리뷰에는 문제의 이유와 수정 방향을 함께 설명해주세요.
        - 같은 내용을 여러 파일에서 반복해서 리뷰하지 말아주세요.
        - 취향이나 스타일 차이만 있는 내용은 리뷰하지 말고, 버그·보안·성능·유지보수성에 영향을 주는 경우에만 리뷰해주세요.
        - 초급 개발자도 이해할 수 있도록 문제의 원인과 수정 방향을 2~3문장 이내로 짧고 구체적으로 설명해주세요.
        - "왜 문제가 되는지"와 "어떻게 수정하면 되는지"를 함께 설명해주세요.
        - 수정을 요구하는 경우에는 가능한 예시 코드 또는 수정 예시를 함께 제시해주세요.
        - 확신이 없는 내용은 리뷰하지 말고, 추측성 리뷰는 남기지 말아주세요.
        - 리뷰 우선순위는 버그 > 보안 > 데이터 무결성 > 성능 > 유지보수성 순으로 판단해주세요.
        - 리뷰 개수보다 중요한 문제를 우선하여 리뷰해주세요.

        [HTTP 상태코드]
        - 팀 컨벤션(200, 201, 400, 401, 403, 404, 500)에 맞게 리뷰해주세요.

        [브랜치 / PR]
        - feature 브랜치 → `dev`로 PR이 향하는지 확인해주세요.
        - PR 제목이 커밋 타입 컨벤션을 따르는지 확인해주세요. 예: `feat: 구매 api 구현`

        [커밋 메시지]
        - 커밋 타입이 아래 컨벤션을 따르는지 확인해주세요:
        - feat: 새로운 기능 추가
        - fix: 버그 수정
        - style: CSS, UI 수정
        - refactor: 코드 리팩토링(기능 변화 없음)
        - remove: 파일 삭제만 수행한 경우
        - chore: 각종 설정 변경

        [API 응답 형식]
        - 성공: `{ "success": true, "data": {...} }`
        - 실패: `{ "success": false, "message": "에러메세지" }`

        [코드 품질]
        - `console.log` 등 디버그 로그가 제거되었는지 확인해주세요.
        - 불필요한 주석이 제거되었는지 확인해주세요.
        - 로컬 빌드/테스트 성공 여부를 PR 체크리스트에서 확인해주세요.

        [입력값 검증]
        - 프로젝트는 validation 라이브러리를 사용하지 않으므로 입력값 검증이 직접 구현되어 있는지 확인해주세요.
        - 필수 파라미터 누락 여부 체크 후 400 반환하는지 확인해주세요.
        - 문자열 길이, 숫자 범위, 이메일 형식 등 수동 검증이 처리되는지 확인해주세요.


        [보안]
        - 환경변수(.env)가 코드에 하드코딩되지 않았는지 확인해주세요.
        - .env 파일이 PR에 포함되어 있지 않은지 확인해주세요.
        - 비밀번호·토큰·시크릿이 로그/응답에 노출되지 않는지 확인해주세요.

    # ─── Router ────────────────────────────────────────────
    - path: '**/modules/**/*.router.ts'
      instructions: |
        - 보호가 필요한 엔드포인트에 `authenticate` / `authorize` 미들웨어가 적절히 적용되어 있는지 확인해주세요.
        - HTTP 메서드·경로가 REST 컨벤션(GET/POST/PATCH/DELETE + /domain, /domain/:id)을 따르는지 검토해주세요.
        - HTTP 상태코드가 팀 컨벤션과 일치하는지 확인해주세요.
        - 라우터에는 비즈니스 로직을 두지 말고 controller로 위임하는지 확인해주세요.

    # ─── Controller ────────────────────────────────────────
    - path: '**/modules/**/*.controller.ts'
      instructions: |
        - 비즈니스 로직이 컨트롤러에 과도하게 집중되어 있지 않은지 확인해주세요 (service 레이어 분리).
        - 모든 async 핸들러에 try-catch가 있고, 에러는 `next(error)`로 전달하는지 확인해주세요.
        - 성공/실패 응답 형식이 팀 컨벤션을 따르는지 확인해주세요.
        - Promise를 반환하는 비동기 함수 호출에서 await 누락으로 인해 예외가 처리되지 않는 경우가 없는지 확인해주세요.

    # ─── Service ───────────────────────────────────────────
    - path: '**/modules/**/*.service.ts'
      instructions: |
        - 여러 테이블을 함께 수정하거나 데이터 정합성이 중요한 작업에는 `$transaction` 사용 여부를 검토해주세요.
        - 관리자/최고관리자 동시 승인·구매 등 예산 충돌 가능성이 있는 로직에 동시성 제어가 있는지 검토해주세요.
        - N+1 쿼리 문제가 발생할 수 있는 패턴이 없는지 확인해주세요.
        - 민감한 필드(password 등)가 응답에서 제외되는지 확인해주세요.
        - HttpError가 프로젝트 상태코드 컨벤션에 맞게 사용되는지 확인해주세요.
        - 실제 버그나 데이터 무결성에 영향을 주는 경우를 우선 리뷰해주세요.

    # ─── Repository ────────────────────────────────────────
    - path: '**/modules/**/*.repository.ts'
      instructions: |
        - DB 접근만 담당하고 비즈니스 로직이 섞여 있지 않은지 확인해주세요.
        - 필요한 데이터만 조회하도록 include/select가 적절히 사용되었는지 확인해주세요.
        - 프로젝트에서 soft delete 또는 company 스코프를 사용하는 경우에만 해당 규칙을 검토해주세요.

    # ─── Middleware / JWT ──────────────────────────────────
    - path: '**/middlewares/**/*.ts'
      instructions: |
        - `next()` 호출 누락으로 요청이 멈추는 케이스가 없는지 확인해주세요.
        - 에러 미들웨어 `(err, req, res, next)` 시그니처가 올바른지 검토해주세요.
        - 인증(Authentication)과 인가(Authorization) 실패를 올바르게 구분하는지 확인해주세요.
        - 토큰에서 추출한 `userId`, `role`, `companyId`를 `req.user`에 담아 전달하는 패턴을 따르는지 확인해주세요.
        - JWT secret이 하드코딩되지 않고 환경변수에서 불러오는지 확인해주세요.
        - 에러 응답 바디에 스택 트레이스나 민감 정보가 노출되지 않는지 확인해주세요.

    # ─── Prisma / DB ───────────────────────────────────────
    - path: '**/prisma/**'
      instructions: |
        - schema 변경 시 migration 파일이 함께 포함되어 있는지 확인해주세요.
        - 새로운 유니크 제약 추가 시 기존 데이터와의 충돌 가능성을 검토해주세요.

    # ─── 테스트 (선택) ─────────────────────────────────────
    - path: '**/*.{test,spec}.ts'
      instructions: |
        - 테스트 파일 작성은 필수가 아니며, 존재하는 경우에만 아래를 검토해주세요.
        - 엣지 케이스와 실패 케이스(에러 응답, 빈 데이터 등)가 테스트되고 있는지 확인해주세요.
        - describe/it 설명이 테스트 의도를 명확히 표현하는지 검토해주세요.
        - 외부 의존성(DB, API)이 적절히 모킹되어 있는지 확인해주세요.

  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/*.lock'
    - '!**/generated/**'
    - '!**/__snapshots__/**'
    - '!**/logs/**'

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'dev'

chat:
  auto_reply: true
